<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minimalist Collage</title>
  <style>
    :root {
      --bg-color: #fafafa;
      --white: #ffffff;
      --instax-border: #f2f2f2;
      --shadow-soft: rgba(0, 0, 0, 0.05);
      --shadow-hard: rgba(0, 0, 0, 0.2);
      --font-stack: 'Courier New', Courier, monospace;
      --empty-bg: #f0f0f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { background-color: var(--bg-color); width: 100vw; height: 100vh; overflow: hidden; font-family: var(--font-stack); }

    /* Music Player Minimalis */
    .music-player-container {
      position: fixed; top: 25px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; z-index: 99999;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); padding: 6px 16px; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05);
    }
    .music-btn { background: transparent; border: none; cursor: pointer; font-size: 1.1rem; color: #333; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }

    /* Canvas Utama */
    .viewport { width: 100%; height: 100%; position: relative; touch-action: none; }
    .canvas { position: absolute; width: 2800px; height: 2800px; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
    .instax-frame { position: absolute; background-color: var(--white); width: 192px; height: 456px; padding: 12px 12px 34px 12px; box-shadow: 2px 4px 10px var(--shadow-soft); border: 1px solid var(--instax-border); cursor: pointer; display: flex; flex-direction: column; gap: 10px; opacity: 0.88; transition: transform 0.2s; }
    .photo-slot { width: 100%; height: 125px; object-fit: cover; background-color: var(--empty-bg); pointer-events: none; }

    /* Modal Popup */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 999999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .modal-wrapper { display: flex; align-items: center; gap: 15px; position: relative; }
    
    /* Container Modal yang bisa di-drag */
    .modal-card { 
      background: var(--white); width: 280px; height: 500px; padding: 15px; border-radius: 8px; 
      display: flex; flex-direction: column; gap: 10px; overflow: hidden; cursor: grab;
      touch-action: none; transform-origin: center; transition: transform 0.1s;
    }
    .modal-card:active { cursor: grabbing; }

    .modal-close-btn { 
      position: absolute; top: -10px; left: -10px; width: 35px; height: 35px; 
      background: var(--white); border-radius: 50%; border: 1px solid #ddd; 
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .modal-zoom-controls { display: flex; flex-direction: column; gap: 10px; }
    .zoom-side-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; }
  </style>
</head>
<body>

  <audio id="bg-music" loop><source src="lagu.mp3" type="audio/mpeg"></audio>
  
  <div class="music-player-container">
    <button class="music-btn" id="playPauseBtn">▶</button>
  </div>

  <div class="viewport" id="viewport">
    <div class="canvas" id="canvas"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-wrapper">
      <div class="modal-card" id="modalCard">
        <div class="modal-close-btn" id="closeModalBtn">✕</div>
        <div id="modalContent" style="display:flex; flex-direction:column; gap:10px; height:100%; transition: transform 0.1s;"></div>
      </div>
      <div class="modal-zoom-controls">
        <button class="zoom-side-btn" onclick="zoomModal(0.2)">+</button>
        <button class="zoom-side-btn" onclick="zoomModal(-0.2)">-</button>
        <button class="zoom-side-btn" onclick="resetModal()">⟲</button>
      </div>
    </div>
  </div>

  <script>
    // Dragging Logic untuk Modal Card
    let modalX = 0, modalY = 0, isDragging = false;
    let startX, startY;
    const modalCard = document.getElementById('modalCard');
    const modalContent = document.getElementById('modalContent');
    let mScale = 1;

    modalCard.addEventListener('pointerdown', e => {
      isDragging = true;
      startX = e.clientX - modalX;
      startY = e.clientY - modalY;
      modalCard.setPointerCapture(e.pointerId);
    });

    window.addEventListener('pointermove', e => {
      if (!isDragging) return;
      modalX = e.clientX - startX;
      modalY = e.clientY - startY;
      modalCard.style.transform = `translate(${modalX}px, ${modalY}px) scale(${mScale})`;
    });

    window.addEventListener('pointerup', () => isDragging = false);

    function zoomModal(amount) {
      mScale = Math.min(Math.max(1, mScale + amount), 3);
      modalCard.style.transform = `translate(${modalX}px, ${modalY}px) scale(${mScale})`;
    }

    function resetModal() {
      mScale = 1; modalX = 0; modalY = 0;
      modalCard.style.transform = `translate(0px, 0px) scale(1)`;
    }

    // Open Modal
    function openModal(photos) {
      modalContent.innerHTML = '';
      photos.forEach(src => {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'photo-slot';
        img.style.height = '33%';
        modalContent.appendChild(img);
      });
      document.getElementById('modalOverlay').classList.add('active');
    }

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('active');
      resetModal();
    });

    // ... (sisanya tetep sama, fokus di logic modal di atas)
  </script>
</body>
</html>
